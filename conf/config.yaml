
defaults:
  - hydra: default
  - model: deflow
  
slurm_id: 00000

wandb_mode: online # [offline, disabled, online]
wandb_log_model: false # upload checkpoints as wandb artifacts; off by default (~1.4GB/run, also avoids NaN-metadata crash on overfit runs)
wandb_project_name: opensceneflow
wandb_entity: orr-a-kelasys

train_data: /home/kin/data/av2/h5py/demo/train
train_aug: False # involved by deltaflow
aug_flip_x_prob: 0.0 # X = forward for forward-facing sensors (e.g. innoviz); front/back mirror is unphysical. Set >0 only for 360° lidar.
aug_flip_y_prob: 0.2 # left/right mirror — symmetry-valid, safe to keep
viz_train_aug: False # log PRE/POST-aug sample panels to wandb each epoch (rank-0, opt-in)
viz_train_aug_samples: 4 # number of samples logged per epoch when viz_train_aug=True
val_data: /home/kin/data/av2/h5py/demo/val

output: ${model.name}-${slurm_id}

checkpoint: 
pretrained_weights: 
eval_only: False

# trainer
num_workers: 8
gpus: 1 # will change in code: torch.cuda.device_count()
sync_bn: true
batch_size: 1
epochs: 3
gradient_clip_val: 5.0

# sanity-check flags (PL Trainer); leave at defaults for real runs
overfit_batches: 0       # 0 = off; 1 (or e.g. 0.01) reuses N batches for train+val with shuffle off
fast_dev_run: false      # true = 1 train+val batch then exit, no logging/ckpts (forces 1 epoch)
limit_train_batches: 1.0 # debug: int = N train batches/epoch, float = fraction; 1.0 = all. Respects epochs.
limit_val_batches: 1.0   # debug: int = N val batches/epoch, float = fraction; 1.0 = all. Respects epochs.

# optimizer ==> Adam
optimizer:
  name: Adam # [Adam, AdamW]
  lr: 2e-4
loss_fn: deflowLoss # choices: [ff3dLoss, zeroflowLoss, deflowLoss, seflowLoss]
# add_seloss: {chamfer_dis: 1.0, static_flow_loss: 1.0, dynamic_chamfer_dis: 1.0, cluster_based_pc0pc1: 1.0}
# ssl_label:

# log settings
seed: 42069
log_every: 10 # steps epochs*dataset_size/batch_size
val_every: 3 # epochs
save_top_model: 5 # top_k model will be saved.
eval_metric: innoviz # [av2, innoviz, both] which val/eval metrics to compute+log; innoviz = per-class x range EPE, no 35m cap

# -----> Model and Task Parameters
voxel_size: [0.2, 0.2, 6]
point_cloud_range: [-51.2, -51.2, -3, 51.2, 51.2, 3]
num_frames: 2
